<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Конструктор драконов</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<main class='layout'>
<section class='controls' aria-label='Настройки дракона'>
<h1>Конструктор драконов</h1>
<fieldset><legend>Чешуя</legend><div id='scales' class='options'></div></fieldset>
<fieldset><legend>Крылья</legend><div id='wings' class='options'></div></fieldset>
<fieldset><legend>Цвет</legend><div id='colors' class='options'></div></fieldset>
<fieldset><legend>Седло</legend><div id='saddles' class='options'></div></fieldset>
<fieldset><legend>Аксессуары</legend><div id='accessories' class='options'></div></fieldset>
<button id='randomBtn' type='button'>Случайный дракон</button>
</section>
<section class='stage'>
<div id='preview'></div>
<p id='caption'></p>
</section>
</main>
<script src='app.js'></script>
</body>
</html>
